[pytest]
# Add the src folder to the import path so tests can "import datadetective"
# without installing the package first.
pythonpath = src

# Custom marker so these Docker-dependent tests are labelled and could be
# selected or skipped as a group later (pytest -m docker).
markers =
    docker: test requires Docker running and the sandbox image built
    integration: test hits the live Ollama model (slower, skipped if unavailable)
